apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-a-simple-app-image-signature
spec:
  validationActions: [Deny]

  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true

  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: apps
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  matchImageReferences:
    - glob: "*"

  variables:
    - name: allImages
      expression: "images.containers + images.initContainers + images.ephemeralContainers"

  attestors:
    - name: openbao
      cosign:
        key:
          kms: "openbao://gitless-gitops"
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true

  validations:
    - expression: "variables.allImages.map(image, verifyImageSignatures(image, [attestors.openbao])).all(e, e > 0)"
      message: "Image signature verification failed using OpenBao transit key 'gitless-gitops'."