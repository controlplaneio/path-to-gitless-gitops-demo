apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-a-simple-app-test-attestations
spec:
  validationActions: [Deny]

  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true

  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: apps
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  matchImageReferences:
    - glob: "*"

  variables:
    - name: allImages
      expression: "images.containers + images.initContainers"

  attestors:
    - name: openbao
      cosign:
        key:
          kms: "openbao://gitless-gitops"
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true

  attestations:
    - name: essentialSecurityTest
      intoto:
        type: "https://in-toto.io/attestation/test-result/v0.1"

  validations:
    - expression: >-
        variables.allImages.map(image, verifyAttestationSignatures(image,
          attestations.essentialSecurityTest, [attestors.openbao])).all(e, e > 0)
      message: "Failed to verify attestation with OpenBao"
    - expression: >-
        variables.allImages.map(image, extractPayload(image, attestations.essentialSecurityTest).predicate.result == 'PASSED').all(e, e)
      message: "essentialSecurityTest is not PASSED"
