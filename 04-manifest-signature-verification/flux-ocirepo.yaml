---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${ARTIFACT_NAME}
  namespace: apps
spec:
  interval: 10m
  url: ${URL}
  ref:
    # tag is here for readability purposes, as FluxCD gives preference to the digest property https://fluxcd.io/flux/components/source/ocirepositories/#reference
    tag: v1.0 
    digest: ${DIGEST}
  verify:
    provider: cosign
    secretRef:
      name: cosign-public-key